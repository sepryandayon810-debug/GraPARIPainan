<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6366f1">
<title>GraPARI Painan — Order Manager</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --bg: #f8fafc;
    --bg-card: #ffffff;
    --text: #0f172a;
    --text-sec: #475569;
    --text-muted: #94a3b8;
    --border: #e2e8f0;
    --shadow: 0 4px 20px rgba(0,0,0,0.08);
    --shadow-lg: 0 10px 40px rgba(0,0,0,0.12);
    --radius: 1rem;
  }

  * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; }
  body { background:var(--bg); color:var(--text); min-height:100vh; }

  /* ===== HEADER ===== */
  .app-header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 1.25rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(102,126,234,0.3);
  }
  .app-header-inner {
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .app-title { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }
  .app-subtitle { font-size: 0.75rem; opacity: 0.85; font-weight: 400; margin-top: 2px; }
  .header-actions { display: flex; gap: 0.5rem; }
  .icon-btn {
    width: 40px; height: 40px;
    border-radius: 12px;
    border: none;
    background: rgba(255,255,255,0.15);
    color: white;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: all 0.2s;
    backdrop-filter: blur(10px);
  }
  .icon-btn:hover { background: rgba(255,255,255,0.25); transform: translateY(-1px); }
  .icon-btn.connected { background: rgba(16,185,129,0.3); }
  .icon-btn.connected i { color: #6ee7b7; }

  /* ===== MAIN ===== */
  .main { max-width: 640px; margin: 0 auto; padding: 1.25rem; }

  /* ===== TABS ===== */
  .tab-bar {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.25rem;
    background: var(--bg-card);
    padding: 0.35rem;
    border-radius: 1rem;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
  }
  .tab-btn {
    flex: 1;
    padding: 0.75rem 0.5rem;
    border: none;
    border-radius: 0.75rem;
    background: transparent;
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
  }
  .tab-btn.active {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    box-shadow: 0 4px 12px rgba(99,102,241,0.3);
  }

  /* ===== CARDS ===== */
  .glass-card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1rem;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .glass-card:hover { box-shadow: var(--shadow-lg); }

  .form-label {
    display: block;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--text-sec);
    margin-bottom: 0.5rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .form-input {
    width: 100%;
    padding: 0.875rem 1rem;
    border: 2px solid var(--border);
    border-radius: 0.875rem;
    font-size: 0.95rem;
    color: var(--text);
    background: var(--bg);
    transition: all 0.2s;
    outline: none;
  }
  .form-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 4px rgba(99,102,241,0.1);
  }
  .form-input::placeholder { color: var(--text-muted); }

  /* ===== BUTTONS ===== */
  .btn-main {
    width: 100%;
    padding: 0.875rem;
    border: none;
    border-radius: 0.875rem;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    color: white;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    box-shadow: 0 4px 15px rgba(99,102,241,0.3);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
  }
  .btn-main:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
  .btn-main:active { transform: translateY(0); }
  .btn-main:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }

  .btn-status {
    flex: 1;
    padding: 0.625rem;
    border: none;
    border-radius: 0.75rem;
    font-size: 0.8rem;
    font-weight: 700;
    cursor: pointer;
    color: white;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
  }
  .btn-status:hover { transform: translateY(-2px); }
  .btn-status:active { transform: translateY(0); }
  .btn-status:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
  .btn-closed { background: linear-gradient(135deg, #10b981, #059669); box-shadow: 0 3px 10px rgba(16,185,129,0.3); }
  .btn-cancelled { background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 3px 10px rgba(239,68,68,0.3); }
  .btn-eskalated { background: linear-gradient(135deg, #f59e0b, #d97706); box-shadow: 0 3px 10px rgba(245,158,11,0.3); }

  /* ===== RESULT ===== */
  .result-area { margin-top: 1rem; }
  .order-card {
    background: linear-gradient(135deg, #ffffff, #f8fafc);
    border: 1.5px solid var(--border);
    border-radius: 1rem;
    padding: 1.25rem;
    margin-bottom: 0.75rem;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
    animation: slideUp 0.4s ease;
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .order-name {
    font-size: 1.05rem;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 0.5rem;
  }
  .order-meta {
    font-size: 0.85rem;
    color: var(--text-sec);
    line-height: 1.7;
  }
  .order-meta b { color: var(--text); font-weight: 600; }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.35rem 0.75rem;
    border-radius: 9999px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .bdg-closed { background: #d1fae5; color: #065f46; }
  .bdg-cancelled { background: #fee2e2; color: #991b1b; }
  .bdg-eskalated { background: #fef3c7; color: #92400e; }
  .bdg-empty { background: #f1f5f9; color: var(--text-muted); }

  .status-row {
    display: flex;
    gap: 0.5rem;
    margin-top: 1rem;
  }

  /* ===== LOADING ===== */
  .loading-box {
    text-align: center;
    padding: 2rem;
    color: var(--text-muted);
  }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 0.75rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .skeleton {
    background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 0.75rem;
    height: 120px;
    margin-bottom: 0.75rem;
  }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ===== EMPTY / ERROR ===== */
  .empty-state {
    text-align: center;
    padding: 2.5rem 1rem;
    color: var(--text-muted);
  }
  .empty-state i { font-size: 2.5rem; margin-bottom: 0.75rem; opacity: 0.4; }
  .empty-title { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 0.25rem; }
  .error-box {
    background: #fef2f2;
    border: 1.5px solid #fecaca;
    color: #dc2626;
    padding: 1rem;
    border-radius: 0.875rem;
    font-size: 0.85rem;
    font-weight: 500;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }

  /* ===== MODAL SETTINGS ===== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(15,23,42,0.6);
    backdrop-filter: blur(8px);
    display: flex; align-items: center; justify-content: center;
    z-index: 1000;
    opacity: 0; visibility: hidden;
    transition: all 0.25s;
    padding: 1rem;
  }
  .modal-overlay.active { opacity: 1; visibility: visible; }
  .modal-box {
    background: var(--bg-card);
    border-radius: 1.5rem;
    width: 100%; max-width: 420px;
    box-shadow: var(--shadow-lg);
    transform: scale(0.92) translateY(20px);
    transition: all 0.25s;
    overflow: hidden;
  }
  .modal-overlay.active .modal-box { transform: scale(1) translateY(0); }
  .modal-head {
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-title { font-size: 1.1rem; font-weight: 700; }
  .modal-close {
    width: 36px; height: 36px;
    border: none; border-radius: 0.75rem;
    background: var(--bg); color: var(--text-muted);
    cursor: pointer; font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: #fee2e2; color: var(--danger); }
  .modal-body { padding: 1.5rem; }
  .modal-foot {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    display: flex; gap: 0.75rem; justify-content: flex-end;
  }
  .btn-ghost {
    padding: 0.625rem 1.25rem;
    border: 1.5px solid var(--border);
    border-radius: 0.75rem;
    background: transparent;
    color: var(--text-sec);
    font-size: 0.875rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-ghost:hover { border-color: var(--primary); color: var(--primary); }

  /* ===== SUCCESS MODAL ===== */
  .success-modal .modal-box { text-align: center; padding: 2rem; max-width: 340px; }
  .success-icon {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10b981, #059669);
    color: white;
    font-size: 1.75rem;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 1rem;
    box-shadow: 0 8px 20px rgba(16,185,129,0.3);
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .success-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 0.35rem; }
  .success-text { font-size: 0.9rem; color: var(--text-sec); margin-bottom: 1.25rem; }
  .btn-done {
    width: 100%;
    padding: 0.75rem;
    border: none; border-radius: 0.875rem;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    font-size: 0.9rem; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 15px rgba(99,102,241,0.3);
  }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(120px);
    background: #1e293b;
    color: white;
    padding: 0.875rem 1.5rem;
    border-radius: 1rem;
    font-size: 0.9rem;
    font-weight: 600;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    z-index: 2000;
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    display: flex;
    align-items: center;
    gap: 0.6rem;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast i { font-size: 1.1rem; }
  .toast.success i { color: #6ee7b7; }
  .toast.error i { color: #fca5a5; }

  /* ===== PANEL ===== */
  .panel { display: none; }
  .panel.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 480px) {
    .app-header { padding: 1rem; }
    .app-title { font-size: 1.1rem; }
    .main { padding: 1rem; }
    .glass-card { padding: 1.25rem; }
    .tab-btn { font-size: 0.78rem; padding: 0.625rem 0.35rem; }
  }
</style>
<base target="_blank">
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="app-header">
  <div class="app-header-inner">
    <div>
      <div class="app-title"><i class="fas fa-bolt" style="margin-right:0.4rem"></i>GraPARI Painan</div>
      <div class="app-subtitle">Order Manager</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="btnSettings" title="Pengaturan">
        <i class="fas fa-cog"></i>
      </button>
    </div>
  </div>
</header>

<!-- ===== MAIN ===== -->
<main class="main">

  <!-- Tabs -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('tabCek')">
      <i class="fas fa-search"></i> Cek & Update
    </button>
    <button class="tab-btn" onclick="switchTab('tabKIP')">
      <i class="fas fa-fingerprint"></i> Cek KIP
    </button>
  </div>

  <!-- PANEL: CEK & UPDATE -->
  <div id="tabCek" class="panel active">
    <div class="glass-card">
      <label class="form-label">Nomor Pelaporan</label>
      <input type="text" class="form-input" id="inpNomor" placeholder="Contoh: PDAk4260330021904074f79790" autocomplete="off">
      <button class="btn-main" style="margin-top:0.75rem" id="btnCek" onclick="cekOrderByNomor()">
        <i class="fas fa-search"></i> Cek Order
      </button>
      <div class="result-area" id="resCek"></div>
    </div>
  </div>

  <!-- PANEL: CEK KIP -->
  <div id="tabKIP" class="panel">
    <div class="glass-card">
      <label class="form-label">Nomor Antre Aja / ID Case</label>
      <input type="text" class="form-input" id="inpKIP" placeholder="Masukkan Nomor Antre Aja" autocomplete="off">
      <button class="btn-main" style="margin-top:0.75rem" id="btnKIP" onclick="cekKIP()">
        <i class="fas fa-fingerprint"></i> Cek KIP
      </button>
      <div class="result-area" id="resKIP"></div>
    </div>
  </div>

</main>

<!-- ===== MODAL: SETTINGS ===== -->
<div class="modal-overlay" id="modalSettings">
  <div class="modal-box">
    <div class="modal-head">
      <div class="modal-title"><i class="fas fa-cog" style="color:var(--primary);margin-right:0.4rem"></i>Pengaturan</div>
      <button class="modal-close" onclick="closeSettings()"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group" style="margin-bottom:1.25rem">
        <label class="form-label">URL Web App GAS</label>
        <input type="url" class="form-input" id="gasUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
        <p style="font-size:0.75rem;color:var(--text-muted);margin-top:0.4rem">
          Deploy GAS sebagai Web App, lalu paste URL di sini.
        </p>
      </div>
      <div id="gasTestResult" style="display:none;padding:0.75rem;border-radius:0.75rem;font-size:0.85rem;font-weight:500"></div>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" onclick="closeSettings()">Tutup</button>
      <button class="btn-main" style="width:auto;padding:0.625rem 1.25rem" onclick="saveSettings()">
        <i class="fas fa-save"></i> Simpan
      </button>
    </div>
  </div>
</div>

<!-- ===== MODAL: SUCCESS UPDATE ===== -->
<div class="modal-overlay success-modal" id="modalSuccess">
  <div class="modal-box">
    <div class="success-icon"><i class="fas fa-check"></i></div>
    <div class="success-title">Berhasil Diupdate!</div>
    <div class="success-text" id="successText">Status telah diubah menjadi CLOSED</div>
    <button class="btn-done" onclick="closeSuccess()">Oke, Mengerti</button>
  </div>
</div>

<!-- ===== TOAST ===== -->
<div class="toast" id="toast"><i class="fas fa-check-circle"></i><span id="toastText">Berhasil</span></div>

<script>
/* ================================
   STATE & CONFIG
   ================================ */
const GAS_URL_KEY = 'grapari_gas_url';
let gasUrl = localStorage.getItem(GAS_URL_KEY) || '';

/* ================================
   UTILS
   ================================ */
function $(id) { return document.getElementById(id); }

function switchTab(id) {
  document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  event.target.classList.add('active');
  $(id).classList.add('active');
}

function showToast(msg, type='success') {
  const t = $('toast');
  $('toastText').textContent = msg;
  t.className = 'toast ' + type + ' show';
  const icon = t.querySelector('i');
  icon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
  setTimeout(() => t.classList.remove('show'), 2800);
}

function showSuccess(msg) {
  $('successText').textContent = msg;
  $('modalSuccess').classList.add('active');
}

function closeSuccess() {
  $('modalSuccess').classList.remove('active');
}

function badgeClass(status) {
  const s = (status || '').toString().trim().toUpperCase();
  if (s === 'CLOSED') return 'bdg-closed';
  if (s === 'CANCELLED') return 'bdg-cancelled';
  if (s === 'ESKALATED') return 'bdg-eskalated';
  return 'bdg-empty';
}

function setLoading(btnId, isLoading, originalHtml) {
  const btn = $(btnId);
  if (isLoading) {
    btn.disabled = true;
    btn.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px;margin:0"></div> Memproses...';
  } else {
    btn.disabled = false;
    btn.innerHTML = originalHtml;
  }
}

/* ================================
   GAS REQUEST
   ================================ */
async function gasRequest(params) {
  if (!gasUrl) throw new Error('URL GAS belum dikonfigurasi. Klik ikon ⚙️ di pojok kanan atas.');
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(gasUrl + '?' + qs);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const json = await res.json();
  if (!json.success) throw new Error(json.error || 'Terjadi kesalahan');
  return json;
}

/* ================================
   SETTINGS MODAL
   ================================ */
function openSettings() {
  $('gasUrlInput').value = gasUrl;
  $('gasTestResult').style.display = 'none';
  $('modalSettings').classList.add('active');
}

function closeSettings() {
  $('modalSettings').classList.remove('active');
}

async function saveSettings() {
  const url = $('gasUrlInput').value.trim();
  if (!url) { showToast('URL wajib diisi', 'error'); return; }

  gasUrl = url;
  localStorage.setItem(GAS_URL_KEY, url);

  // Test koneksi
  const resultDiv = $('gasTestResult');
  resultDiv.style.display = 'block';
  resultDiv.style.background = '#eff6ff';
  resultDiv.style.color = '#1e40af';
  resultDiv.textContent = '⏳ Mengetes koneksi...';

  try {
    await gasRequest({ action: 'test' });
    resultDiv.style.background = '#ecfdf5';
    resultDiv.style.color = '#065f46';
    resultDiv.textContent = '✅ Koneksi berhasil!';
    showToast('Tersimpan & terhubung!');
    setTimeout(closeSettings, 600);
  } catch (e) {
    resultDiv.style.background = '#fef2f2';
    resultDiv.style.color = '#991b1b';
    resultDiv.textContent = '❌ ' + e.message;
  }
}

/* ================================
   1. CEK ORDER
   ================================ */
async function cekOrderByNomor() {
  const nomor = $('inpNomor').value.trim();
  if (!nomor) { showToast('Nomor Pelaporan wajib diisi', 'error'); return; }

  const resDiv = $('resCek');
  resDiv.innerHTML = '<div class="loading-box"><div class="spinner"></div><div>Mencari data...</div></div>';
  setLoading('btnCek', true, '<i class="fas fa-search"></i> Cek Order');

  try {
    const data = await gasRequest({ action: 'cekOrderByNomor', nomor: nomor });

    if (data.total === 0) {
      resDiv.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-search"></i>
          <div class="empty-title">Tidak ditemukan</div>
          <div>Nomor Pelaporan tidak ada di sheet DATA PAINAN</div>
        </div>`;
      return;
    }

    let html = '';
    data.data.forEach(function(item, idx) {
      html += `
        <div class="order-card" id="card-${idx}">
          <div class="order-name">${item.namaPelanggan || 'Tanpa Nama'}</div>
          <div class="order-meta">
            <div><b>Nomor:</b> ${item.nomorPelaporan}</div>
            <div><b>NIK CS:</b> ${item.nikCS || '-'}</div>
            <div><b>Layanan:</b> ${item.jenisLayanan || '-'}</div>
            <div><b>Keterangan:</b> ${item.keterangan || '-'}</div>
            <div style="margin-top:0.5rem">
              <b>Status:</b> <span class="badge ${badgeClass(item.statusPelaporan)}">${item.statusPelaporan || 'BELUM ADA'}</span>
            </div>
          </div>
          <div class="status-row">
            <button class="btn-status btn-closed" onclick="updateStatus('${item.nomorPelaporan}', 'CLOSED', ${idx})">
              <i class="fas fa-check"></i> CLOSED
            </button>
            <button class="btn-status btn-cancelled" onclick="updateStatus('${item.nomorPelaporan}', 'CANCELLED', ${idx})">
              <i class="fas fa-times"></i> CANCELLED
            </button>
            <button class="btn-status btn-eskalated" onclick="updateStatus('${item.nomorPelaporan}', 'ESKALATED', ${idx})">
              <i class="fas fa-exclamation-triangle"></i> ESKALATED
            </button>
          </div>
        </div>
      `;
    });
    resDiv.innerHTML = html;

  } catch (err) {
    resDiv.innerHTML = '<div class="error-box"><i class="fas fa-exclamation-circle"></i> ' + err.message + '</div>';
  } finally {
    setLoading('btnCek', false, '<i class="fas fa-search"></i> Cek Order');
  }
}

/* ================================
   UPDATE STATUS
   ================================ */
async function updateStatus(nomor, status, idx) {
  const card = $('card-' + idx);
  const btns = card.querySelectorAll('.btn-status');
  btns.forEach(function(b) { b.disabled = true; });

  try {
    await gasRequest({ action: 'updateStatus', nomorPelaporan: nomor, statusBaru: status });

    // Update badge visual
    const badge = card.querySelector('.badge');
    badge.className = 'badge ' + badgeClass(status);
    badge.textContent = status;

    // Popup modal sukses (besar & jelas)
    showSuccess('Status laporan ' + nomor + ' telah berhasil diubah menjadi ' + status);

    // Toast juga
    showToast('✅ ' + nomor + ' → ' + status);

  } catch (err) {
    showToast('❌ Gagal: ' + err.message, 'error');
  } finally {
    btns.forEach(function(b) { b.disabled = false; });
  }
}

/* ================================
   2. CEK KIP
   ================================ */
async function cekKIP() {
  const id = $('inpKIP').value.trim();
  if (!id) { showToast('ID wajib diisi', 'error'); return; }

  const resDiv = $('resKIP');
  resDiv.innerHTML = '<div class="loading-box"><div class="spinner"></div><div>Mencari data...</div></div>';
  setLoading('btnKIP', true, '<i class="fas fa-fingerprint"></i> Cek KIP');

  try {
    const data = await gasRequest({ action: 'cekKIP', id: id });

    if (data.total === 0) {
      resDiv.innerHTML = `
        <div class="empty-state">
          <i class="fas fa-fingerprint"></i>
          <div class="empty-title">ID tidak ditemukan</div>
          <div>Nomor Antre Aja tidak ada di sheet DATA PAINAN</div>
        </div>`;
      return;
    }

    let html = '';
    data.data.forEach(function(item) {
      html += `
        <div class="order-card">
          <div class="order-name"><i class="fas fa-fingerprint" style="margin-right:0.4rem;color:var(--primary)"></i>KIP ID: ${item.nomorAntreAja}</div>
          <div class="order-meta">
            <div><b>Tanggal:</b> ${item.tanggal || '-'}</div>
            <div><b>Antrian:</b> ${item.nomorAntrian || '-'}</div>
            <div><b>Petugas (NIK):</b> ${item.nikCS || '-'}</div>
            <div><b>Indihome:</b> ${item.indihome || '-'}</div>
            <div><b>Evidence:</b> <a href="${item.evidence || '#'}" target="_blank" style="color:var(--primary);font-weight:600">${item.evidence || '-'}</a></div>
          </div>
        </div>
      `;
    });
    resDiv.innerHTML = html;

  } catch (err) {
    resDiv.innerHTML = '<div class="error-box"><i class="fas fa-exclamation-circle"></i> ' + err.message + '</div>';
  } finally {
    setLoading('btnKIP', false, '<i class="fas fa-fingerprint"></i> Cek KIP');
  }
}

/* ================================
   INIT
   ================================ */
document.addEventListener('DOMContentLoaded', function() {
  // Settings button
  $('btnSettings').addEventListener('click', openSettings);

  // Close modal on backdrop click
  $('modalSettings').addEventListener('click', function(e) {
    if (e.target === this) closeSettings();
  });
  $('modalSuccess').addEventListener('click', function(e) {
    if (e.target === this) closeSuccess();
  });

  // Enter key
  $('inpNomor').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') cekOrderByNomor();
  });
  $('inpKIP').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') cekKIP();
  });

  // Auto-test kalau URL sudah ada
  if (gasUrl) {
    gasRequest({ action: 'test' })
      .then(() => {
        $('btnSettings').classList.add('connected');
        $('btnSettings').title = 'Terhubung ke KKM';
      })
      .catch(() => {
        $('btnSettings').classList.remove('connected');
        $('btnSettings').title = 'Gagal terhubung — klik untuk setting';
      });
  }
});
</script>
